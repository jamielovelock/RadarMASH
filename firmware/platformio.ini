; RadarMASH firmware for the GeekMagic Radar 360 (ESP32-S3, 16 MB flash). Build with ./build.sh, not `pio run -t upload`:
; the device has no USB data lines, so images go over Wi-Fi, and only the app image may ever be written.
[env:radar360]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_build.partitions = default_16MB.csv
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0 -DCORE_DEBUG_LEVEL=0 -I../core -O2
build_src_filter = +<*> +<../../core/*.cpp>
