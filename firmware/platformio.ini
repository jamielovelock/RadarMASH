; RadarMASH firmware for the GeekMagic Radar 360 (ESP32-S3, 16 MB flash). Build with ./build.sh, not `pio run -t upload`:
; the device has no USB data lines, so images go over Wi-Fi, and only the app image may ever be written.
[env:radar360]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = dio
; Flash is quad (run as DIO); the 8 MB PSRAM is octal. The quad-PSRAM build (dio_qspi) boots but does not find it.
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv
; BOARD_HAS_PSRAM: without it the Arduino core compiles its PSRAM support out entirely.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0 -DCORE_DEBUG_LEVEL=0 -I../core -O2 -DBOARD_HAS_PSRAM
build_src_filter = +<*> +<../../core/*.cpp>
; PNG decoder for map tiles (Apache-2.0).
lib_deps = bitbank2/PNGdec@^1.1.0
